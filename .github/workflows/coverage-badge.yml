name: Tests & Coverage Badge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 需要寫入 coverage.svg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage coverage-badge

      - name: Run tests with coverage
        run: |
          coverage run -m pytest || true
          coverage xml || true
          coverage report || true
      
      - name: Generate coverage badge
        run: coverage-badge -o coverage.svg -f
        if: always()

      - name: Commit coverage.svg if changed
        run: |
          if ! git diff --quiet -- coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add coverage.svg
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          else
            echo "No changes in coverage badge."
          fi
